<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>DAIL 센터 관리</title>
  <link rel="stylesheet" href="/center-dashboard/styles.css" />
</head>
<body>
  <header class="topbar"><a href="/" class="brand"><span>◉</span> DAIL <small>센터 관리</small></a><button id="logoutButton" class="ghost" type="button" hidden>로그아웃</button></header>
  <main>
    <section id="loginPanel" class="login-card">
      <p class="eyebrow">CENTER PARTNER</p><h1>내 센터 관리</h1>
      <p>DAIL에 등록된 센터 정보와 이용자 반응을 확인하세요.</p>
      <form id="loginForm">
        <label>이메일<input id="email" type="email" autocomplete="username" required placeholder="owner@example.com" /></label>
        <label>비밀번호<input id="password" type="password" autocomplete="current-password" required /></label>
        <button type="submit">로그인</button><p id="loginMessage" class="message" aria-live="polite"></p>
      </form>
    </section>

    <section id="dashboard" class="dashboard" hidden>
      <div class="welcome"><div><p class="eyebrow">DAIL CENTER</p><h1 id="centerHeading">센터 관리</h1><p id="accountEmail"></p></div><a class="preview-link" href="/#search" target="_blank">사이트에서 보기 ↗</a></div>
      <div class="metrics"><article><span>센터 상세 조회</span><strong id="views">0</strong></article><article><span>상담 버튼 클릭</span><strong id="contacts">0</strong></article><article><span>등록 후기</span><strong id="reviews">0</strong></article><article><span>평균 평점</span><strong id="rating">-</strong></article></div>
      <div class="dashboard-grid">
        <section class="panel editor"><div class="panel-title"><div><p class="eyebrow">CENTER PROFILE</p><h2>센터 정보 수정</h2></div><span id="saveStatus"></span></div>
          <form id="centerForm">
            <div class="two"><label>센터명<input name="name" required maxlength="200" /></label><label>지역<input name="area" required maxlength="200" /></label></div>
            <label>상세 주소<input name="address" required maxlength="200" /></label>
            <div class="two"><label>대표 전화<input name="phone" maxlength="40" placeholder="02-000-0000" /></label><label>웹사이트<input name="website" maxlength="200" placeholder="https://" /></label></div>
            <label>운영시간<textarea name="opening_hours" rows="3" maxlength="500" placeholder="평일 09:00–21:00"></textarea></label>
            <label>센터 소개<textarea name="lead" rows="5" maxlength="800"></textarea></label>
            <label>전문 분야 태그<input name="tags" maxlength="300" placeholder="허리, 어깨, 자세 분석" /><small>쉼표로 구분해 최대 12개까지 입력합니다.</small></label>
            <div class="two"><label>운영자 소개<input name="therapist" maxlength="200" /></label><label>가격 안내<input name="price" maxlength="200" /></label></div>
            <label>상담 안내<input name="conversion" maxlength="200" /></label>
            <button type="submit" class="primary">변경사항 저장</button>
          </form>
        </section>
        <aside class="side-stack"><section class="panel"><p class="eyebrow">RECENT ACTIVITY</p><h2>최근 이용자 활동</h2><div id="eventList" class="list"></div></section><section class="panel"><p class="eyebrow">REVIEWS</p><h2>최근 후기</h2><div id="reviewList" class="list"></div></section></aside>
      </div>
    </section>
  </main>
  <script src="/center-dashboard/app.js"></script>
</body>
</html>
