<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1200,initial-scale=1" />
  <title>DAIL social preview</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
  <style>
    *{box-sizing:border-box}
    html,body{width:1200px;height:630px;margin:0;overflow:hidden}
    body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f2f3ef;color:#0f1c2e}
    .card{width:1200px;height:630px;position:relative;overflow:hidden;display:grid;grid-template-columns:1.03fr .97fr;background:linear-gradient(120deg,#f7f7f4 0%,#f0f2ed 58%,#e8efed 100%)}
    .card:before{content:"";width:420px;height:420px;position:absolute;right:-130px;top:-155px;border:1px solid rgba(21,129,135,.2);border-radius:50%}
    .card:after{content:"";width:620px;height:620px;position:absolute;right:-230px;top:-255px;border:1px solid rgba(15,28,46,.08);border-radius:50%}
    .copy{padding:72px 0 66px 78px;position:relative;z-index:2;display:flex;flex-direction:column}
    .eyebrow{margin:0;color:#158187;font-size:17px;font-weight:850;letter-spacing:.14em}
    h1{margin:58px 0 0;font-size:86px;line-height:1.02;letter-spacing:-.07em;font-weight:850;color:#101418}
    h1 em{color:#158187;font-style:normal}
    .lead{margin:36px 0 0;color:#4f5653;font-size:22px;line-height:1.55;letter-spacing:-.025em}
    .address{margin:auto 0 0;padding-top:20px;border-top:1px solid #ccd3ce;color:#69706c;font-size:14px;font-weight:720;letter-spacing:.03em}
    .symbol-zone{position:relative;z-index:1;display:grid;place-items:center}
    .symbol-disc{width:428px;height:428px;position:relative;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.84);box-shadow:0 30px 70px rgba(15,28,46,.08)}
    .symbol-disc:before{content:"";position:absolute;inset:-24px;border:1px solid rgba(21,129,135,.13);border-radius:50%}
    .symbol-disc img{width:306px;height:306px;display:block;object-fit:contain}
    .wordmark{position:absolute;right:68px;bottom:56px;display:flex;align-items:baseline;gap:13px;color:#0f1c2e}
    .wordmark strong{font-size:25px;letter-spacing:.09em}
    .wordmark span{color:#6a736e;font-size:12px;font-weight:750}
  </style>
</head>
<body>
  <main class="card">
    <section class="copy">
      <p class="eyebrow">DAIL — 다시, 일상으로</p>
      <h1>다시,<br /><em>일상으로</em></h1>
      <p class="lead">내 주변의 믿을 수 있는<br />전문 운동센터를 발견하는 곳</p>
      <p class="address">brand.dail.life</p>
    </section>
    <section class="symbol-zone" aria-label="DAIL 로고">
      <div class="symbol-disc"><img src="../dail-logo-primary.png?v=20260812-logo-alpha" alt="DAIL" /></div>
      <div class="wordmark"><strong>DAIL</strong><span>다시, 일상으로</span></div>
    </section>
  </main>
</body>
</html>
