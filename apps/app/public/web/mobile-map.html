<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DAIL 모바일 지도 | 다시 일상으로</title>
    <link rel="icon" type="image/png" href="/assets/dail-logo-primary.png?v=20260812-logo-alpha" />
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: #eef4ef;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      }

      .marker {
        position: relative;
        isolation: isolate;
        width: 150px;
        height: 42px;
        padding: 0 9px 0 6px;
        display: grid;
        grid-template-columns: 30px minmax(0, 1fr) auto;
        align-items: center;
        gap: 7px;
        border: 1px solid rgba(15, 23, 42, 0.11);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.97);
        color: #0f172a;
        box-shadow: 0 7px 18px rgba(15, 28, 46, 0.16);
        text-align: left;
        white-space: nowrap;
      }

      .marker::before {
        content: "";
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: radial-gradient(circle at center, #fff 0 3px, transparent 3.5px),
          linear-gradient(145deg, #158187, #106165);
      }

      .marker strong,
      .marker span {
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        line-height: 1;
      }

      .marker strong {
        font-size: 12px;
        font-weight: 850;
      }

      .marker span {
        padding: 6px;
        border-radius: 999px;
        background: #fff7ed;
        color: #d97706;
        font-size: 9px;
        font-weight: 800;
      }

      .cluster {
        width: 56px;
        height: 56px;
        border: 4px solid rgba(255, 255, 255, 0.96);
        border-radius: 999px;
        background: linear-gradient(145deg, #158187, #106165);
        color: white;
        font-size: 17px;
        font-weight: 900;
        box-shadow: 0 0 0 6px rgba(13, 148, 136, 0.14),
          0 14px 32px rgba(15, 118, 110, 0.28);
      }

      .cluster.is-opening {
        pointer-events: none;
        animation: cluster-open 0.68s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      body.is-revealing-centers .marker {
        animation: marker-reveal 0.36s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      @keyframes cluster-open {
        0% { opacity: 1; transform: scale(1); }
        38% { opacity: 1; transform: scale(1.14); }
        100% { opacity: 0.18; transform: scale(0.78); }
      }

      @keyframes marker-reveal {
        0% { opacity: 0; transform: scale(0.84); }
        100% { opacity: 1; transform: scale(1); }
      }

      @media (prefers-reduced-motion: reduce) {
        .cluster.is-opening,
        body.is-revealing-centers .marker { animation: none; }
      }

      .notice {
        position: fixed;
        left: 12px;
        right: 12px;
        top: 12px;
        z-index: 10;
        border: 1px solid #d9e3de;
        border-radius: 8px;
        padding: 10px 12px;
        background: rgba(255, 255, 255, 0.94);
        color: #607069;
        font-size: 13px;
        font-weight: 800;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="notice" class="notice">네이버 지도 인증을 확인해주세요.</div>

    <script>
      const API_BASE =
        new URLSearchParams(window.location.search).get("apiBase") ||
        (window.location.protocol === "file:" ? "http://localhost:8090" : window.location.origin);
      let publicConfig = {
        naverMapNcpKeyId: new URLSearchParams(window.location.search).get("naverKeyId") || "",
      };
      let centers = [
        { id: "core", name: "코어핏", rating: "4.9", lat: 37.4979, lng: 127.0276 },
        { id: "reform", name: "리폼무브", rating: "4.8", lat: 37.5557, lng: 126.9236 },
        { id: "posture", name: "포스처랩", rating: "4.7", lat: 37.3827, lng: 127.1189 },
        { id: "shoulder", name: "숄더워크", rating: "4.9", lat: 37.5243, lng: 127.0399 },
      ];
      let map;
      let centerMarkers = [];
      let clusterMarkers = [];
      let centerFocusTimers = [];
      const CENTER_MARKER_MIN_ZOOM = 13;

      function showNotice() {
        document.querySelector("#notice").style.display = "block";
      }

      function loadMapSdk() {
        const key = publicConfig.naverMapNcpKeyId;
        if (!key) {
          showNotice();
          return;
        }

        const script = document.createElement("script");
        script.src = `https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${encodeURIComponent(key)}&v=${Date.now()}`;
        script.onload = initMap;
        script.onerror = showNotice;
        document.head.appendChild(script);
      }

      async function loadPublicConfig() {
        if (publicConfig.naverMapNcpKeyId) return;
        try {
          const response = await fetch(`${API_BASE}/api/config`, {
            headers: { "X-Movemap-Client": "mobile-map" },
          });
          if (!response.ok) throw new Error("config unavailable");
          publicConfig = await response.json();
        } catch {
          showNotice();
        }
      }

      async function loadCenters() {
        try {
          const response = await fetch(`${API_BASE}/api/centers`, {
            headers: { "X-Movemap-Client": "mobile-map" },
          });
          if (!response.ok) throw new Error("centers unavailable");
          const data = await response.json();
          const approvedCenters = (data.centers || [])
            .map((center) => ({
              id: center.id,
              name: center.name,
              rating: center.rating || "신규",
              lat: Number(center.lat),
              lng: Number(center.lng),
            }))
            .filter((center) => center.name && center.lat && center.lng);

          if (approvedCenters.length) centers = approvedCenters;
        } catch {
          showNotice();
        }
      }

      function initMap() {
        if (!window.naver?.maps) {
          showNotice();
          return;
        }

        map = new naver.maps.Map("map", {
          center: new naver.maps.LatLng(37.5036, 127.0247),
          zoom: 10,
          minZoom: 7,
          scaleControl: false,
          logoControl: true,
          mapDataControl: false,
          zoomControl: false,
          overlayZoomEffect: "all",
          tileTransition: true,
          tileDuration: 320,
        });

        rebuildMarkers();
        naver.maps.Event.addListener(map, "zoom_changed", handleZoomChanged);
        naver.maps.Event.addListener(map, "click", () => {
          window.ReactNativeWebView?.postMessage(JSON.stringify({ type: "clear_selection" }));
        });
      }

      function markerContent(center) {
        const rating = center.rating && center.rating !== "신규" ? center.rating : "신규";
        const ratingLabel = rating === "신규" ? "신규 센터" : `★ ${rating}`;
        return `<button class="marker" type="button"><strong>${center.name.slice(0, 9)}</strong><span>${ratingLabel}</span></button>`;
      }

      function rebuildMarkers() {
        centerMarkers.forEach((marker) => marker.setMap(null));
        clusterMarkers.forEach((marker) => marker.setMap(null));
        centerMarkers = centers.map((center) => {
          const marker = new naver.maps.Marker({
            position: new naver.maps.LatLng(center.lat, center.lng),
            map,
            title: center.name,
            icon: {
              content: markerContent(center),
              size: new naver.maps.Size(150, 46),
              anchor: new naver.maps.Point(75, 43),
            },
          });

          naver.maps.Event.addListener(marker, "click", (event) => {
            window.ReactNativeWebView?.postMessage(
              JSON.stringify({ type: "center_select", id: center.id })
            );
            event?.domEvent?.stopPropagation?.();
          });
          return marker;
        });

        syncMarkerMode();
      }

      function clearCenterFocusTimers() {
        centerFocusTimers.forEach((timer) => window.clearTimeout(timer));
        centerFocusTimers = [];
      }

      function queueCenterFocusStep(callback, delay) {
        const timer = window.setTimeout(() => {
          centerFocusTimers = centerFocusTimers.filter((item) => item !== timer);
          callback();
        }, delay);
        centerFocusTimers.push(timer);
      }

      function focusCenterById(id) {
        const center = centers.find((item) => item.id === id);
        if (!center || !map) return;

        const position = new naver.maps.LatLng(center.lat, center.lng);
        clearCenterFocusTimers();
        map.__forceIndividualMarkers = true;
        map.__clusterAnimating = true;
        clusterMarkers.forEach((marker) => marker.setMap(null));
        clusterMarkers = [];
        map.setZoom(Math.max(map.getZoom(), CENTER_MARKER_MIN_ZOOM + 2), true);
        map.setCenter(position);
        queueCenterFocusStep(() => {
          map.setCenter(position);
        }, 120);
        queueCenterFocusStep(() => {
          map.setCenter(position);
          map.__clusterAnimating = false;
          map.__forceIndividualMarkers = true;
          syncMarkerMode();
        }, 360);
      }

      function handleNativeMessage(event) {
        try {
          const message = JSON.parse(event.data);
          if (message.type === "focus_center" && message.id) {
            focusCenterById(message.id);
          }
        } catch {}
      }

      function shouldShowIndividuals() {
        return map.getZoom() >= CENTER_MARKER_MIN_ZOOM || map.__forceIndividualMarkers;
      }

      function markerCellSizeForZoom(zoom) {
        if (zoom <= 8) return 2.2;
        if (zoom <= 10) return 1.0;
        if (zoom <= 12) return 0.35;
        return 0.12;
      }

      function centerForGroup(group) {
        const lat = group.reduce((sum, center) => sum + center.lat, 0) / group.length;
        const lng = group.reduce((sum, center) => sum + center.lng, 0) / group.length;
        return new naver.maps.LatLng(lat, lng);
      }

      function targetZoomForGroup(group) {
        const latValues = group.map((center) => center.lat);
        const lngValues = group.map((center) => center.lng);
        const span = Math.max(
          Math.max(...latValues) - Math.min(...latValues),
          Math.max(...lngValues) - Math.min(...lngValues)
        );
        if (span > 1.2) return 8;
        if (span > 0.45) return 10;
        if (span > 0.16) return 11;
        if (span > 0.06) return 12;
        return CENTER_MARKER_MIN_ZOOM;
      }

      function zoomToGroup(group) {
        const targetCenter = centerForGroup(group);
        const targetZoom = Math.min(
          CENTER_MARKER_MIN_ZOOM,
          Math.max(map.getZoom() + 2, targetZoomForGroup(group))
        );
        const reduceMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches;
        const duration = reduceMotion ? 0 : 680;

        clearCenterFocusTimers();
        map.stop?.();
        map.__forceIndividualMarkers = false;
        map.__clusterAnimating = true;
        document.body.classList.remove("is-revealing-centers");

        if (duration && typeof map.morph === "function") {
          map.morph(targetCenter, targetZoom, {
            duration,
            easing: "easeOutCubic",
          });
        } else {
          map.setCenter(targetCenter);
          map.setZoom(targetZoom, true);
        }

        queueCenterFocusStep(() => {
          map.__clusterAnimating = false;
          map.__forceIndividualMarkers = true;
          document.body.classList.add("is-revealing-centers");
          syncMarkerMode();
          queueCenterFocusStep(() => {
            document.body.classList.remove("is-revealing-centers");
          }, 380);
        }, duration + 90);
      }

      function groupedCenters() {
        const size = markerCellSizeForZoom(map.getZoom());
        const groups = new Map();
        centers.forEach((center) => {
          const key = `${Math.floor(center.lat / size)}:${Math.floor(center.lng / size)}`;
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(center);
        });
        return [...groups.values()];
      }

      function rebuildClusters() {
        clusterMarkers.forEach((marker) => marker.setMap(null));
        clusterMarkers = groupedCenters().map((group) => {
          const position = centerForGroup(group);
          const marker = new naver.maps.Marker({
            position,
            map,
            title: `${group.length}개 센터`,
            icon: {
              content: `<button class="cluster" type="button" aria-label="${group.length}개 센터 보기">${group.length}</button>`,
              size: new naver.maps.Size(56, 56),
              anchor: new naver.maps.Point(28, 28),
            },
          });
          naver.maps.Event.addListener(marker, "click", () => {
            marker.setIcon({
              content: `<button class="cluster is-opening" type="button" aria-label="${group.length}개 센터 보기">${group.length}</button>`,
              size: new naver.maps.Size(56, 56),
              anchor: new naver.maps.Point(28, 28),
            });
            zoomToGroup(group);
          });
          return marker;
        });
      }

      function syncMarkerMode() {
        if (map.__clusterAnimating) return;

        const showIndividuals = shouldShowIndividuals();
        centerMarkers.forEach((marker) => marker.setMap(showIndividuals ? map : null));
        if (showIndividuals) {
          clusterMarkers.forEach((marker) => marker.setMap(null));
          clusterMarkers = [];
        } else {
          rebuildClusters();
        }
      }

      function handleZoomChanged() {
        if (map.__clusterAnimating) return;

        if (map.getZoom() < CENTER_MARKER_MIN_ZOOM) {
          map.__forceIndividualMarkers = false;
          window.ReactNativeWebView?.postMessage(JSON.stringify({ type: "clear_selection" }));
        }

        syncMarkerMode();
      }

      function fitInitialBounds() {
        const bounds = new naver.maps.LatLngBounds();
        centers.forEach((center) => {
          bounds.extend(new naver.maps.LatLng(center.lat, center.lng));
        });
        if (centers.length > 1) {
          map.fitBounds(bounds, { top: 36, right: 36, bottom: 36, left: 36 });
        }
      }

      document.addEventListener("message", handleNativeMessage);
      window.addEventListener("message", handleNativeMessage);
      Promise.all([loadPublicConfig(), loadCenters()]).finally(loadMapSdk);
    </script>
  </body>
</html>
