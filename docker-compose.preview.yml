services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: staging
      DATA_ENVIRONMENT: staging
      PORT: "3000"
      NAVER_MAP_NCP_KEY_ID: ${NAVER_MAP_NCP_KEY_ID:?required}
      SUPABASE_URL: ${SUPABASE_URL:?required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?required}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      KAKAO_AUTH_ENABLED: ${KAKAO_AUTH_ENABLED:-false}
      APPLE_AUTH_ENABLED: ${APPLE_AUTH_ENABLED:-false}
      NAVER_LOGIN_CLIENT_ID: ${NAVER_LOGIN_CLIENT_ID:-}
      NAVER_LOGIN_CLIENT_SECRET: ${NAVER_LOGIN_CLIENT_SECRET:-}
      USER_AUTH_STATE_SECRET: ${USER_AUTH_STATE_SECRET:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-movemap-private-staging}
      EXPECTED_SUPABASE_PROJECT_REF: ${EXPECTED_SUPABASE_PROJECT_REF:?required}
      ADMIN_PASSWORD_SCRYPT: ${ADMIN_PASSWORD_SCRYPT:?required}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?required}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - traefik.enable=true
      - traefik.docker.network=movemap-preview-edge
      - traefik.http.routers.${PREVIEW_SLUG:?required}.rule=Host(`${PREVIEW_HOST:?required}`)
      - traefik.http.routers.${PREVIEW_SLUG}.entrypoints=websecure
      - traefik.http.routers.${PREVIEW_SLUG}.tls=true
      - traefik.http.routers.${PREVIEW_SLUG}.tls.certresolver=letsencrypt
      - traefik.http.routers.${PREVIEW_SLUG}.middlewares=staging-auth@file,staging-headers@file
      - traefik.http.services.${PREVIEW_SLUG}.loadbalancer.server.port=3000
    networks:
      - preview-edge
      - private
      - egress

networks:
  preview-edge:
    external: true
    name: movemap-preview-edge
  private:
    internal: true
  egress:
