services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: production
      DATA_ENVIRONMENT: production
      PORT: "3000"
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:-}
      IOS_APP_STORE_URL: ${IOS_APP_STORE_URL:-}
      GOOGLE_PLAY_STORE_URL: ${GOOGLE_PLAY_STORE_URL:-}
      NAVER_MAP_NCP_KEY_ID: ${NAVER_MAP_NCP_KEY_ID:?required}
      NAVER_SEARCH_CLIENT_ID: ${NAVER_SEARCH_CLIENT_ID:-}
      NAVER_SEARCH_CLIENT_SECRET: ${NAVER_SEARCH_CLIENT_SECRET:-}
      SUPABASE_URL: ${SUPABASE_URL:?required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?required}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      AUTH_SUPABASE_URL: ${AUTH_SUPABASE_URL:?required}
      AUTH_SUPABASE_ANON_KEY: ${AUTH_SUPABASE_ANON_KEY:?required}
      AUTH_SUPABASE_SERVICE_ROLE_KEY: ${AUTH_SUPABASE_SERVICE_ROLE_KEY:?required}
      KAKAO_AUTH_ENABLED: ${KAKAO_AUTH_ENABLED:-false}
      APPLE_AUTH_ENABLED: ${APPLE_AUTH_ENABLED:-false}
      NAVER_LOGIN_CLIENT_ID: ${NAVER_LOGIN_CLIENT_ID:-}
      NAVER_LOGIN_CLIENT_SECRET: ${NAVER_LOGIN_CLIENT_SECRET:-}
      USER_AUTH_STATE_SECRET: ${USER_AUTH_STATE_SECRET:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-movemap-private}
      EXPECTED_SUPABASE_PROJECT_REF: ${EXPECTED_SUPABASE_PROJECT_REF:?required}
      EXPECTED_AUTH_SUPABASE_PROJECT_REF: ${EXPECTED_AUTH_SUPABASE_PROJECT_REF:?required}
      ADMIN_PASSWORD_SCRYPT: ${ADMIN_PASSWORD_SCRYPT:?required}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?required}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      ALLOW_LEGACY_ADMIN_LOGIN: ${ALLOW_LEGACY_ADMIN_LOGIN:-true}
      OWNER_SESSION_SECRET: ${OWNER_SESSION_SECRET:-}
      REGISTRATION_CHALLENGE_SECRET: ${REGISTRATION_CHALLENGE_SECRET:-}
      ANALYTICS_SESSION_SECRET: ${ANALYTICS_SESSION_SECRET:-}
      LOG_HASH_SECRET: ${LOG_HASH_SECRET:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      APP_MEMORY_ALERT_MB: ${APP_MEMORY_ALERT_MB:-400}
      APP_CPU_ALERT_PERCENT: ${APP_CPU_ALERT_PERCENT:-85}
      APP_DB_SIZE_ALERT_MB: ${APP_DB_SIZE_ALERT_MB:-400}
      APP_DB_CONNECTION_ALERT_PERCENT: ${APP_DB_CONNECTION_ALERT_PERCENT:-80}
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      private:
        aliases:
          - production-app
      egress:

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      MOVEMAP_DOMAIN: ${MOVEMAP_DOMAIN:-_}
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/tls:/etc/nginx/tls:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:size=1m,noexec,nosuid
      - /var/cache/nginx:size=64m,noexec,nosuid
      - /var/run:size=8m,noexec,nosuid
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    networks:
      - private
      - preview-edge
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=movemap-preview-edge"
      - "traefik.http.routers.dail-production.rule=Host(`${PRODUCTION_HOST:-dail.157-90-26-205.sslip.io}`)"
      - "traefik.http.routers.dail-production.entrypoints=websecure"
      - "traefik.http.routers.dail-production.tls=true"
      - "traefik.http.routers.dail-production.tls.certresolver=letsencrypt"
      - "traefik.http.services.dail-production.loadbalancer.server.port=80"

  backup:
    profiles:
      - backup
    build:
      context: ./deploy/backup
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      SUPABASE_S3_ENDPOINT: ${SUPABASE_S3_ENDPOINT:-}
      SUPABASE_S3_REGION: ${SUPABASE_S3_REGION:-us-east-1}
      SUPABASE_S3_ACCESS_KEY_ID: ${SUPABASE_S3_ACCESS_KEY_ID:-}
      SUPABASE_S3_SECRET_ACCESS_KEY: ${SUPABASE_S3_SECRET_ACCESS_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-movemap-private}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      RESTIC_CACHE_DIR: /var/cache/movemap-backup/restic
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-auto}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - backup-cache:/var/cache/movemap-backup
    healthcheck:
      test: ["CMD", "/usr/local/bin/backup-healthcheck"]
      interval: 1h
      timeout: 10s
      retries: 3
      start_period: 10m
    read_only: true
    tmpfs:
      - /tmp:size=512m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backup

networks:
  private:
    internal: true
  egress:
  backup:
  preview-edge:
    external: true
    name: movemap-preview-edge

volumes:
  backup-cache:
